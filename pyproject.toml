[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-somnus"
version = "0.1.0"
description = "Idle-time self-improvement, memory consolidation and sandboxed experimentation for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Deliberately minimal. This runs on a Raspberry Pi; every dependency is a
    # future breakage. PyYAML already ships with Hermes.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[project.entry-points."hermes_agent.plugins"]
somnus = "somnus:register"

[tool.setuptools.packages.find]
include = ["somnus*"]

[tool.setuptools.package-data]
somnus = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
